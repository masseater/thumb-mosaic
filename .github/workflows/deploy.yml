name: deploy

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The verify run whose characters have been deployed
        required: true
        type: string
      sha:
        description: The commit that run verified
        required: true
        type: string

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.head.outputs.latest }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF_NAME" --jq .sha)"
          if [ "$current" = "$HEAD_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: plan
    if: needs.plan.outputs.latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: live-*
          path: apps/web/public/files
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: vp exec alchemy deploy --stage production --yes
        working-directory: apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  web-vitals:
    needs: deploy
    if: vars.ZAP_TARGET_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: web-vitals
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: vp run measure "$TARGET_URL"
        working-directory: tools/web-vitals
        env:
          TARGET_URL: ${{ vars.ZAP_TARGET_URL }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-vitals
          path: tools/web-vitals/report/
          if-no-files-found: ignore

  ci-telemetry:
    needs: [plan, deploy, web-vitals]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci-telemetry.sh
            apps/web/app-name.ts
          sparse-checkout-cone-mode: false
      - run: .github/scripts/ci-telemetry.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
