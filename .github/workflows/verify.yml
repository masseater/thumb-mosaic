name: verify

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          gh auth setup-git
          commits="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$HEAD_SHA" --jq .total_commits)"
          git fetch --no-tags --depth="$((commits + 1))" origin "$HEAD_SHA"
          vp exec commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/oxlint-plugin-decision
          key: oxlint-plugin-decision-${{ github.sha }}
          restore-keys: oxlint-plugin-decision-
      - if: github.event_name == 'push'
        run: vp run gitleaks
        env:
          GITLEAKS_BASE: ${{ github.event.before }}
      - id: verify
        run: vp run --log grouped verify
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: always() && steps.verify.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/oxlint-plugin-decision
          key: oxlint-plugin-decision-${{ github.sha }}

  autofix:
    needs: verify
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          FAILED_RUN_ID: ${{ github.run_id }}
        run: >-
          gh workflow run autofix.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          -f run_id="$FAILED_RUN_ID" -f branch="$HEAD_BRANCH" -f sha="$HEAD_SHA"

  plan:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.head.outputs.latest }}
      slugs: ${{ steps.slugs.outputs.slugs }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF_NAME" --jq .sha)"
          if [ "$current" = "$HEAD_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.latest == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: libs/mosaic/src/characters.json
          sparse-checkout-cone-mode: false
      - id: slugs
        if: steps.head.outputs.latest == 'true'
        run: echo "slugs=$(jq -c '[.[].slug]' libs/mosaic/src/characters.json)" >> "$GITHUB_OUTPUT"

  songs:
    needs: plan
    if: needs.plan.outputs.latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    env:
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - id: pool
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mosaic/.cache/pool.tar
          key: mosaic-pool-${{ matrix.slug }}-${{ github.run_id }}
          restore-keys: |
            mosaic-pool-${{ matrix.slug }}-
      - if: steps.pool.outputs.cache-matched-key != ''
        run: |
          if tar -tf pool.tar -- "$SLUG/vocadb/songs.json" > /dev/null; then
            tar -xf pool.tar -- "$SLUG/vocadb/songs.json"
          fi
          rm pool.tar
        working-directory: tools/mosaic/.cache
      - run: uv run mosaic songs "$SLUG"
        working-directory: tools/mosaic
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: songs-${{ matrix.slug }}
          path: tools/mosaic/.cache/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  mosaic:
    needs: [plan, songs]
    if: ${{ !cancelled() && needs.plan.outputs.latest == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: mosaic-${{ matrix.slug }}
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    env:
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - id: pool
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mosaic/.cache/pool.tar
          key: mosaic-pool-${{ matrix.slug }}-${{ github.run_id }}
          restore-keys: |
            mosaic-pool-${{ matrix.slug }}-
      - if: steps.pool.outputs.cache-matched-key != ''
        run: |
          if tar -tf pool.tar -- "$SLUG" > /dev/null; then
            tar -xf pool.tar -- "$SLUG"
          fi
          rm pool.tar
        working-directory: tools/mosaic/.cache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: songs-${{ matrix.slug }}
          path: tools/mosaic/.cache
      - id: build-pool
        run: uv run mosaic pool "$SLUG"
        working-directory: tools/mosaic
      - run: uv run mosaic solve "$SLUG"
        working-directory: tools/mosaic
      - run: uv run mosaic site "$SLUG"
        working-directory: tools/mosaic
      - if: always() && steps.build-pool.outcome != 'skipped'
        run: |
          files=()
          for file in small target.png vocadb/songs.json thumbs.npz niconico-og.json; do
            if [ -e "$SLUG/$file" ]; then
              files+=("$SLUG/$file")
            fi
          done
          tar -cf pool.tar -- "${files[@]}"
        working-directory: tools/mosaic/.cache
      - if: always() && steps.build-pool.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mosaic/.cache/pool.tar
          key: mosaic-pool-${{ matrix.slug }}-${{ hashFiles(format('tools/mosaic/.cache/{0}/vocadb/songs.json', matrix.slug), format('tools/mosaic/.cache/{0}/thumbs.npz', matrix.slug), format('tools/mosaic/.cache/{0}/niconico-og.json', matrix.slug)) }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mosaic-${{ matrix.slug }}
          path: apps/web/public/files/
          if-no-files-found: error
          retention-days: 1

  files:
    needs: [plan, mosaic]
    if: ${{ !cancelled() && needs.plan.outputs.latest == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: files-${{ matrix.slug }}
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    env:
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mosaic-${{ matrix.slug }}
          path: apps/web/public/files
      - run: vp exec alchemy deploy alchemy.files.ts --stage "$SLUG" --yes
        working-directory: apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: |
          mkdir -p "$RUNNER_TEMP/live/$SLUG"
          cp "apps/web/public/files/$SLUG/manifest.json" "apps/web/public/files/$SLUG/candidates.json" "$RUNNER_TEMP/live/$SLUG/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-${{ matrix.slug }}
          path: ${{ runner.temp }}/live/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: [plan, files]
    if: ${{ !cancelled() && needs.plan.outputs.latest == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: live-*
          path: apps/web/public/files
          merge-multiple: true
      - run: |
          jq -r '.[].slug' ../../libs/mosaic/src/characters.json | while read -r slug; do
            vp exec alchemy state rm "thumb-mosaic/production/Files-$slug"
          done
          if vp exec alchemy state ls thumb-mosaic/production | grep -F "Files-"; then
            exit 1
          fi
        working-directory: apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: vp exec alchemy deploy --stage production --yes
        working-directory: apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  web-vitals:
    needs: deploy
    if: github.event_name == 'push' && vars.ZAP_TARGET_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: vp run measure "$TARGET_URL"
        working-directory: tools/web-vitals
        env:
          TARGET_URL: ${{ vars.ZAP_TARGET_URL }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-vitals
          path: tools/web-vitals/report/
          if-no-files-found: ignore

  release:
    needs: verify
    if: github.repository == 'masseater/typescript-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
          skip-github-pull-request: true
      - if: github.event_name == 'workflow_dispatch'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
          skip-github-release: true

  ci-telemetry:
    needs: [verify, autofix, plan, songs, mosaic, files, deploy, web-vitals, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci-telemetry.sh
            apps/web/app-name.ts
          sparse-checkout-cone-mode: false
      - run: .github/scripts/ci-telemetry.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
