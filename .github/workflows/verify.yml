name: verify

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          gh auth setup-git
          commits="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$HEAD_SHA" --jq .total_commits)"
          git fetch --no-tags --depth="$((commits + 1))" origin "$HEAD_SHA"
          vp exec commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/oxlint-plugin-decision
          key: oxlint-plugin-decision-${{ github.sha }}
          restore-keys: oxlint-plugin-decision-
      - if: github.event_name == 'push'
        run: vp run gitleaks
        env:
          GITLEAKS_BASE: ${{ github.event.before }}
      - id: verify
        run: vp run --log grouped verify
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: always() && steps.verify.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/oxlint-plugin-decision
          key: oxlint-plugin-decision-${{ github.sha }}

  autofix:
    needs: verify
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          FAILED_RUN_ID: ${{ github.run_id }}
        run: >-
          gh workflow run autofix.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_BRANCH"
          -f run_id="$FAILED_RUN_ID" -f branch="$HEAD_BRANCH" -f sha="$HEAD_SHA"

  plan:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.head.outputs.latest }}
      slugs: ${{ steps.slugs.outputs.slugs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/latest-commit.sh
            libs/mosaic/src/characters.json
          sparse-checkout-cone-mode: false
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/latest-commit.sh
      - id: slugs
        if: steps.head.outputs.latest == 'true'
        run: echo "slugs=$(jq -c '[.[].slug]' libs/mosaic/src/characters.json)" >> "$GITHUB_OUTPUT"

  character:
    needs: plan
    if: needs.plan.outputs.latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: write
      contents: read
    concurrency:
      group: character-${{ matrix.slug }}
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.slugs) }}
    env:
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: start
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/latest-commit.sh
      - if: steps.start.outputs.latest == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - id: pool
        if: steps.start.outputs.latest == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mosaic/.cache/pool.tar
          key: mosaic-pool-${{ matrix.slug }}-${{ github.run_id }}
          restore-keys: |
            mosaic-pool-${{ matrix.slug }}-
      - if: steps.start.outputs.latest == 'true' && steps.pool.outputs.cache-matched-key != ''
        run: |
          if tar -tf pool.tar -- "$SLUG" > /dev/null; then
            tar -xf pool.tar -- "$SLUG"
          fi
          rm pool.tar
        working-directory: tools/mosaic/.cache
      - if: steps.start.outputs.latest == 'true'
        run: sleep "$((JOB_INDEX * 30))"
        env:
          JOB_INDEX: ${{ strategy.job-index }}
      - if: steps.start.outputs.latest == 'true'
        run: uv run mosaic songs "$SLUG"
        timeout-minutes: 30
        continue-on-error: true
        working-directory: tools/mosaic
      - id: build-pool
        if: steps.start.outputs.latest == 'true'
        run: uv run mosaic pool "$SLUG"
        working-directory: tools/mosaic
      - if: steps.start.outputs.latest == 'true'
        run: uv run mosaic solve "$SLUG"
        working-directory: tools/mosaic
      - if: steps.start.outputs.latest == 'true'
        run: uv run mosaic site "$SLUG"
        working-directory: tools/mosaic
      - if: always() && steps.build-pool.outcome != 'skipped'
        run: |
          files=()
          for file in small target.png vocadb/songs.json thumbs.npz niconico-og.json; do
            if [ -e "$SLUG/$file" ]; then
              files+=("$SLUG/$file")
            fi
          done
          tar -cf pool.tar -- "${files[@]}"
        working-directory: tools/mosaic/.cache
      - if: always() && steps.build-pool.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/mosaic/.cache/pool.tar
          key: mosaic-pool-${{ matrix.slug }}-${{ hashFiles(format('tools/mosaic/.cache/{0}/vocadb/songs.json', matrix.slug), format('tools/mosaic/.cache/{0}/thumbs.npz', matrix.slug), format('tools/mosaic/.cache/{0}/niconico-og.json', matrix.slug)) }}
      - id: changed
        if: steps.start.outputs.latest == 'true'
        run: |
          rm -rf tools/mosaic/.cache
          if [ -d "apps/web/public/files/$SLUG/0" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.changed == 'true'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - id: still
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/latest-commit.sh
      - if: steps.still.outputs.latest == 'true'
        run: .github/scripts/cloudflare-token.sh
      - if: steps.still.outputs.latest == 'true'
        run: vp exec alchemy deploy alchemy.files.ts --stage "$SLUG" --yes
        working-directory: apps/web
      - if: steps.start.outputs.latest == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/live/$SLUG"
          cp "apps/web/public/files/$SLUG/manifest.json" "apps/web/public/files/$SLUG/candidates.json" "$RUNNER_TEMP/live/$SLUG/"
      - if: steps.start.outputs.latest == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-${{ matrix.slug }}
          path: ${{ runner.temp }}/live/
          if-no-files-found: error
          retention-days: 1
      - if: steps.start.outputs.latest == 'true'
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$REF_NAME" -f run_id="$RUN_ID" -f sha="$HEAD_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}

  release:
    needs: verify
    if: github.repository == 'masseater/typescript-template'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
          skip-github-pull-request: true
      - if: github.event_name == 'workflow_dispatch'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
          skip-github-release: true

  ci-telemetry:
    needs: [verify, autofix, plan, character, release]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/ci-telemetry.sh
            .github/scripts/cloudflare-token.sh
            apps/web/app-name.ts
          sparse-checkout-cone-mode: false
      - if: github.ref == 'refs/heads/main'
        run: .github/scripts/cloudflare-token.sh
      - run: .github/scripts/ci-telemetry.sh
        env:
          GH_TOKEN: ${{ github.token }}
